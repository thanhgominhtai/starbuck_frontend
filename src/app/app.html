<!-- 💡 M3-1: Khung chứa toàn bộ ứng dụng có thanh trượt menu -->
<mat-sidenav-container class="app-sidenav-container">
  
  <!-- 💡 M3-1 & D1: Menu trượt Navigation Drawer bên trái.
       - mode="over": Màn hình nhỏ trượt đè lên nội dung
       - mode="side": Màn hình lớn mở cố định kế bên nội dung
       - opened: Màn lớn tự mở (true), màn nhỏ tự đóng (false)
  -->
  <mat-sidenav
    #drawer
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    class="app-sidenav"
  >
    <!-- Đầu trang Menu -->
    <div class="sidenav-header p-16">
      <mat-icon class="brand-icon">local_cafe</mat-icon>
      <span class="brand-title">Quầy Trà Sữa</span>
    </div>
    
    <mat-divider></mat-divider>
    
    <!-- Danh sách link điều hướng trong Menu -->
    <mat-nav-list>
      <!-- Link Menu Món Trà: exact: true đảm bảo chỉ tô sáng khi URL trùng 100% /drinks -->
      <a
        mat-list-item
        routerLink="/drinks"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="isHandset() ? drawer.close() : null"
      >
        <mat-icon matListItemIcon>local_cafe</mat-icon>
        <span matListItemTitle>Menu Món Trà</span>
      </a>

      <!-- Link Thêm món mới -->
      <a
        mat-list-item
        routerLink="/drinks/new"
        routerLinkActive="active-link"
        (click)="isHandset() ? drawer.close() : null"
      >
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>Thêm món mới</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- 💡 M3-1: Vùng nội dung chính nằm cạnh hoặc bên dưới Drawer -->
  <mat-sidenav-content class="app-sidenav-content">
    
    <!-- 💡 M3-1: Thanh Top App Bar cố định đỉnh màn hình -->
    <mat-toolbar class="app-toolbar">
      <!-- Nút ☰ đóng/mở menu trượt khi bấm -->
      <button
        mat-icon-button
        (click)="drawer.toggle()"
        aria-label="Mở menu điều hướng"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Quầy Trà Sữa</span>
    </mat-toolbar>

    <!-- Khung chính nạp nội dung trang qua RouterOutlet -->
    <main class="main-content p-24">
      <router-outlet></router-outlet>
    </main>

    <!-- 💡 M3-2: Nút FAB nổi ở góc dưới bên phải màn hình để Thêm món nhanh -->
    <a
      mat-fab
      class="app-fab"
      routerLink="/drinks/new"
      aria-label="Thêm món mới"
    >
      <mat-icon>add</mat-icon>
    </a>
  </mat-sidenav-content>
</mat-sidenav-container>
